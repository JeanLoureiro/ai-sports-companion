    latitude: -28.0890
    longitude: 153.4560
    swell_from: [90, 170]
    offshore_from: [200, 290]
    min_swell_m: 0.8
    favourite: true
  - name: Currumbin Alley
    aliases: [currumbin, the alley, alley, currumbin alley]
    latitude: -28.1283
    longitude: 153.4850
    swell_from: [90, 180]
    offshore_from: [180, 270]
    min_swell_m: 0.6
    favourite: true
  - name: Duranbah
    aliases: [dbah, d bah, d'bah, duranbah beach]
